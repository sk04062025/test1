# oauth2-proxy.cfg

provider = "oidc"
# IMPORTANT: If your Backstage backend is also running in Docker,
# you cannot use 'localhost'. Use the service name instead.
# For example: upstream = "http://backstage-backend:7007"
upstream = "http://localhost:7007"

# --- Keycloak Settings ---
# Replace with your Keycloak server's address and realm.
# If Keycloak is in Docker, use its container name: http://keycloak:8080/realms/your-realm
oidc_issuer_url = "http://localhost:8080/realms/your-realm"
client_id = "backstage" # Your Keycloak client ID
client_secret = "your-client-secret" # Your Keycloak client secret

# --- Proxy Settings ---
http_address = "0.0.0.0:4180" # Listen on all network interfaces inside the container
redirect_url = "http://localhost:4180/oauth2/callback"
cookie_secret = "generate-a-super-long-random-string-for-this" # MUST be a long, random string

# --- User/Token Settings ---
email_domains = [ "*" ]
pass_authorization_header = true
set_xauthrequest = true
